# SIGp, pacote da entrega acadêmica: só o fluxo de gestão de contas de provedores (busca de notas no Gmail, OCR,
# associação ao local e ao provedor, IA local com RAG, SQL Server com RLS, mascaramento e trilha ledger).
# Gerado por entrega/montar-entrega.ps1 a partir do sistema completo. Suba com: pwsh -File instalar.ps1
# Mesmos nomes de container e portas do sistema completo: todos os scripts da entrega funcionam sem mudança.
# Tudo local: nenhuma porta fora do 127.0.0.1, nenhuma chave de LLM externa, nenhum dado sai da máquina.
name: sigp_entrega
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sigp_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - SIGP_HOST=0.0.0.0
      - SIGP_PORT=5001
      - SIGP_API_KEY=${SIGP_API_KEY:?Rode instalar.ps1 para gerar o .env}
      - SIGP_MODULOS=gestao
      - SIGP_CORS_ORIGINS=http://127.0.0.1:8000,http://localhost:8000
      - SIGP_EXIGIR_FATURA=1
      # Sem o WF-05 (SIG/SIE) neste pacote: a API não envia eventos ao n8n.
      - SIGP_N8N_EVENTOS_URL=
      - SIGP_COFRE_CHAVE=${SIGP_COFRE_CHAVE:-}
      - SIGP_PUBLIC_API_URL=http://127.0.0.1:5001
      - SIGP_PUBLIC_N8N_URL=http://127.0.0.1:5678
      # Assistente e painel da IA: o mesmo modelo local da triagem (instalação leve: qwen2.5:0.5b).
      - SIGP_OLLAMA_URL=http://ollama:11434
      - SIGP_OLLAMA_MODEL=${SIGP_OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ./backend/data:/app/backend/data
      - ./entrega:/app/entrega:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  web:
    image: nginx:1.27-alpine
    container_name: sigp_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./agencias.html:/usr/share/nginx/html/agencias.html:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      SIGP_PUBLIC_API_URL: http://127.0.0.1:5001
      SIGP_PUBLIC_N8N_URL: http://127.0.0.1:5678
      # O pacote não tem o WF-01/WF-02: a nota digitada na tela vai direto para a API.
      SIGP_PUBLIC_MODO_ENTRADA: api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  ocr:
    build:
      context: ./ocr
    container_name: sigp_fatura_ocr
    restart: unless-stopped
    environment:
      SIGP_PDF_SENHA_CNPJS: ${SIGP_PDF_SENHA_CNPJS:-}
    expose:
      - "5002"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    mem_limit: 768m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  ollama:
    image: ollama/ollama:0.40.14
    container_name: sigp_ollama
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  n8n:
    image: n8nio/n8n:2.43.4
    container_name: sigp_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_EDITOR_BASE_URL=http://127.0.0.1:5678/
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SIGP_API_URL=http://api:5001
      - SIGP_API_KEY=${SIGP_API_KEY:?Rode instalar.ps1 para gerar o .env}
      - SIGP_ACADEMIC_AI_KEY=${SIGP_AI_API_KEY:?Rode instalar.ps1 para gerar o .env}
      - SIGP_OLLAMA_URL=http://ollama:11434
      - SIGP_OLLAMA_MODEL=${SIGP_OLLAMA_MODEL:-qwen2.5:3b}
      # Notificações opcionais (GUIA-CONFIGURACAO.md): ponha no .env e rode  docker compose up -d n8n
      - SIGP_RELATORIO_EMAIL=${SIGP_RELATORIO_EMAIL:-}
      - SIGP_TELEGRAM_CHAT_ID=${SIGP_TELEGRAM_CHAT_ID:-}
      - SIGP_WHATSAPP_URL=${SIGP_WHATSAPP_URL:-}
      - SIGP_WHATSAPP_NUMERO=${SIGP_WHATSAPP_NUMERO:-}
      - SIGP_WHATSAPP_APIKEY=${SIGP_WHATSAPP_APIKEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
  sqlserver-academic:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sigp_sqlserver_academic
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Rode instalar.ps1 para gerar o .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 2560m
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql_data:/var/opt/mssql
  academic-ai:
    build:
      context: .
      dockerfile: docs/entrega-academica/ia/Dockerfile
    container_name: sigp_academic_ai
    restart: unless-stopped
    environment:
      SIGP_AI_API_KEY: ${SIGP_AI_API_KEY:?Rode instalar.ps1 para gerar o .env}
      SIGP_AI_LOCAL_ID: LOC-001
      SIGP_AI_REQUESTER: n8n-demo
      SIGP_SQLCMD_SERVER: sqlserver-academic,1433
      SIGP_SQLCMD_USER: sigp_ia_loc001
      SIGP_SQLCMD_DATABASE: SIGpAcademic
      SQLCMDPASSWORD: ${SIGP_AI_DB_PASSWORD_LOC001:?Rode instalar.ps1 para gerar o .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      MODEL_BACKEND: ollama
      MODEL_URL: http://ollama:11434
      MODEL_NAME: qwen2.5:0.5b
      MODEL_PROFILE: baseline
    mem_limit: 512m
    ports:
      - "127.0.0.1:5010:5010"
    depends_on:
      - sqlserver-academic
      - ollama
volumes:
  n8n_data:
  ollama_data:
  sql_data:
